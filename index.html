<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="patrick.css">
    <link rel="stylesheet" href="flo.css">
    <link rel="stylesheet" href="michael.css">

</head>

<body>

    <header>

        <img src="./assets/icons/travel-logo.png" alt="travel-logo">
    </header>

    <section class="landing-page">
        <div class="circle">
            <div class="inner circle">


            </div>

        </div>
    </section>

    <main>
        <section class="highlights">

            <img src="./assets/icons/rocket_launch.png" alt="Rocket Launch Icon">
            <h2> Highlights</h2>

        </section>

        <section class="slider-a">
            <input type="radio" name="slider" value="one" checked>
            <input type="radio" name="slider" value="two">
            <input type="radio" name="slider" value="three">

            <div slider-a-wrapper>
                <div class="slider-a-element element-one"></div>
                <div class="slider-a-element element-two"></div>
                <div class="slider-a-element element-three"></div>
            </div>

        </section>

    </main>
