<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="patrick.css">
    <link rel="stylesheet" href="flo.css">
    <link rel="stylesheet" href="michael.css">

</head>

<body>

    <header class="header" id="top">
        <div class="header-inner">

            <a class="logo" href="#top">
                <img src="./assets/icons/travel-logo.png" alt="Travel Blog">
            </a>

            <nav>
                <ul class="navigation">
                    <li>
                        <a href="#highlights">Höhepunkte</a>
                    </li>

                    <li>
                        <a href="#faq">Häufige Fragen</a>
                    </li>

                    <li>
                        <a href="#contact">Kontakt</a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        <section class="hero">
            <h1>Hauptüberschrift</h1>
        </section>

        <section class="highlights section" id="highlights">
            <div class="content-width">

                <h2 class="section-heading">
                    <img
                        src="./assets/icons/rocket_launch.png"
                        alt=""
                    >

                    Höhepunkte
                </h2>

                <div class="highlight-card">
                    <h3>Überschrift</h3>

                    <div class="slider-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>

            </div>
        </section>

        <section class="faq section" id="faq">
            <div class="content-width">

                <h2 class="section-heading">
                    <img
                        src="./assets/icons/live_help.png"
                        alt=""
                    >

                    Häufige Fragen
                </h2>

                <div class="faq-list">
                    <div class="faq-item"></div>
                    <div class="faq-item"></div>
                    <div class="faq-item"></div>
                    <div class="faq-item"></div>
                </div>

            </div>
        </section>

        <section class="contact section" id="contact">
            <div class="contact-width">

                <h2 class="section-heading">
                    <img
                        src="./assets/icons/person_pin.png"
                        alt=""
                    >

                    Kontaktformular
                </h2>

                <form class="contact-form">

                    <div class="form-row">
                        <input
                            type="text"
                            name="name"
                            aria-label="Name"
                        >

                        <input
                            type="email"
                            name="email"
                            aria-label="E-Mail-Adresse"
                        >
                    </div>

                    <textarea
                        name="message"
                        rows="3"
                        aria-label="Nachricht"
                    ></textarea>

                    <label class="checkbox-row">
                        <input type="checkbox">
                        <span></span>
                    </label>

                    <button type="submit">
                        Senden
                    </button>

                </form>

            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-inner">

            <div class="footer-left">

                <p class="copyright">
                    <span>©</span>
                    <span>Travel Blog 2026</span>
                </p>

                <a href="#">Impressum</a>

                <a href="#">
                    Datenschutz-Einstellungen
                </a>

            </div>

            <div class="social-links">

                <a href="#">
                    <img
                        src="./assets/icons/Tiktok_icon 1.png"
                        alt="TikTok"
                    >
                </a>

                <a class="youtube" href="#">
                    <img
                        src="./assets/icons/youtube.png"
                        alt="YouTube"
                    >
                </a>

                <a href="#">
                    <img
                        src="./assets/icons/facebook.png"
                        alt="Facebook"
                    >
                </a>

                <a href="#">
                    <img
                        src="./assets/icons/Instagram_logo_2016 1.png"
                        alt="Instagram"
                    >
                </a>

            </div>

        </div>
    </footer>

</body>

</html>
